[project]
name = "water-reports"
version = "0.1.0"
description = "Solinst LevelSender report emails to ThingsBoard and .xlsx/.ods spreadsheets"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's default selection changes between releases.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
